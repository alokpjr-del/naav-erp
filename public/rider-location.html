<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>NAAV Rider Location</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f4f6f8;color:#111827}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(430px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;padding:24px;box-shadow:0 18px 50px rgba(15,23,42,.10)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.logo{width:48px;height:48px;border-radius:14px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px}.brand h1{font-size:20px;margin:0}.brand p{margin:3px 0 0;color:#64748b;font-size:12px}
label{display:block;font-size:12px;font-weight:700;color:#475569;margin:0 0 7px}input,select{width:100%;padding:13px 14px;border:1px solid #dbe1e8;border-radius:12px;outline:none;font-size:14px;margin-bottom:15px;background:#fff}input:focus,select:focus{border-color:#111827}
.status{padding:15px;border-radius:15px;background:#f8fafc;border:1px solid #e2e8f0;margin:5px 0 15px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#94a3b8;margin-right:7px}.dot.on{background:#16a34a}.status strong{font-size:14px}.muted{font-size:12px;color:#64748b;margin-top:5px}
button{width:100%;border:0;border-radius:13px;padding:14px;font-size:14px;font-weight:800;cursor:pointer;margin-top:9px}.primary{background:#111827;color:#fff}.danger{background:#fee2e2;color:#991b1b}.secondary{background:#eef2ff;color:#3730a3}
.location{display:none;margin-top:15px;padding:14px;border-radius:14px;background:#f8fafc;border:1px solid #e2e8f0;font-size:12px;line-height:1.7}.location.show{display:block}.row{display:flex;justify-content:space-between;gap:10px}.value{font-weight:700;color:#0f172a}
.notice{font-size:11px;color:#64748b;line-height:1.5;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="wrap"><main class="card">
<div class="brand"><div class="logo">N</div><div><h1>NAAV Rider Location</h1><p>Simple live location sharing</p></div></div>

<label>Select Registered Rider</label>
<select id="riderSelect" onchange="onRiderSelect(this.value)">
    <option value="">-- Choose Rider or Enter Below --</option>
</select>

<label>Rider Name</label><input id="riderName" placeholder="Enter rider name">
<label>Rider ID / Mobile</label><input id="riderId" placeholder="Enter rider ID or mobile">
<div class="status"><div><span id="dot" class="dot"></span><strong id="statusText">Location Sharing Off</strong></div><div id="statusSub" class="muted">Tap Start Location to begin.</div></div>
<button id="startBtn" class="primary">📍 Start Location Sharing</button>
<button id="stopBtn" class="danger" style="display:none">⛔ Stop Location Sharing</button>
<button id="testBtn" class="secondary">🧪 Test GPS</button>
<div id="locationBox" class="location">
<div class="row"><span>Latitude</span><span id="lat" class="value">-</span></div>
<div class="row"><span>Longitude</span><span id="lng" class="value">-</span></div>
<div class="row"><span>Accuracy</span><span id="acc" class="value">-</span></div>
<div class="row"><span>Last Updated</span><span id="updated" class="value">-</span></div>
</div>
<div class="notice">📍 Location Permission Required. Serve this page over HTTPS (or localhost) for GPS tracking.</div>
</main></div>
<script>
const $=id=>document.getElementById(id);
let watchId=null;
let registeredRiders=[];
const LOCATION_API='/api/rider-location';

// Fetch registered delivery boys from NAAV backend
async function loadRegisteredRiders() {
    try {
        const res = await fetch('/api/delivery-boys');
        if (!res.ok) return;
        registeredRiders = await res.json();
        const sel = $('riderSelect');
        if (sel && registeredRiders.length > 0) {
            registeredRiders.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.id || r.name;
                opt.textContent = `${r.name} (${r.id || 'Rider'})`;
                sel.appendChild(opt);
            });
        }
    } catch(e) {}
}
loadRegisteredRiders();

function onRiderSelect(val) {
    if (!val) return;
    const r = registeredRiders.find(x => (x.id || x.name) === val);
    if (r) {
        $('riderName').value = r.name || '';
        $('riderId').value = r.id || r.mobile || r.name;
    }
}

function setStatus(on,title,sub){$('dot').classList.toggle('on',on);$('statusText').textContent=title;$('statusSub').textContent=sub;$('startBtn').style.display=on?'none':'block';$('stopBtn').style.display=on?'block':'none'}
function renderPosition(p){
 const c=p.coords,n=new Date();
 $('lat').textContent=c.latitude.toFixed(6);$('lng').textContent=c.longitude.toFixed(6);$('acc').textContent=Math.round(c.accuracy)+' m';$('updated').textContent=n.toLocaleTimeString();$('locationBox').classList.add('show');
 const payload={riderId:$('riderId').value.trim(),riderName:$('riderName').value.trim(),latitude:c.latitude,longitude:c.longitude,accuracy:c.accuracy,timestamp:n.toISOString()};
 fetch(LOCATION_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}).catch(()=>{});
}
function gpsError(e){const m={1:'Location permission was denied. Allow location access in browser settings.',2:'Your location could not be determined.',3:'Location request timed out.'};setStatus(false,'Location Sharing Off',m[e.code]||'Unable to get location.')}
function startLocation(){
 if(!$('riderName').value.trim()||!$('riderId').value.trim())return alert('Please enter Rider Name and Rider ID / Mobile.');
 if(!navigator.geolocation)return setStatus(false,'GPS Not Supported','This browser does not support GPS location.');
 setStatus(true,'Location Sharing On','Requesting GPS location…');
 watchId=navigator.geolocation.watchPosition(renderPosition,gpsError,{enableHighAccuracy:true,maximumAge:10000,timeout:20000});
}
function stopLocation(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);watchId=null;setStatus(false,'Location Sharing Off','Location sharing has been stopped.')}
$('startBtn').onclick=startLocation;$('stopBtn').onclick=stopLocation;
$('testBtn').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(renderPosition,gpsError,{enableHighAccuracy:true,timeout:15000,maximumAge:0}):alert('GPS is not supported in this browser.');
</script>
</body></html>
